<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 192" width="132" height="192" role="img" aria-label="三体 封面">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0713"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="gPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd0e4"/>
      <stop offset="32%" stop-color="#ff4d8d"/>
      <stop offset="100%" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9fff8"/>
      <stop offset="32%" stop-color="#39e6d6"/>
      <stop offset="100%" stop-color="#39e6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6d0ff"/>
      <stop offset="32%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="132" height="192" fill="url(#sky)"/>

  <!-- pixel starfield -->
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="14" y="18" width="2" height="2"/>
    <rect x="30" y="34" width="2" height="2" opacity="0.7"/>
    <rect x="52" y="14" width="2" height="2" opacity="0.85"/>
    <rect x="80" y="22" width="2" height="2" opacity="0.6"/>
    <rect x="104" y="30" width="2" height="2"/>
    <rect x="118" y="16" width="2" height="2" opacity="0.7"/>
    <rect x="20" y="120" width="2" height="2" opacity="0.6"/>
    <rect x="112" y="112" width="2" height="2" opacity="0.8"/>
    <rect x="96" y="132" width="2" height="2" opacity="0.55"/>
    <rect x="44" y="140" width="2" height="2" opacity="0.7"/>
  </g>
  <g fill="#39e6d6" shape-rendering="crispEdges">
    <rect x="66" y="26" width="2" height="2" opacity="0.8"/>
    <rect x="24" y="52" width="2" height="2" opacity="0.6"/>
    <rect x="110" y="60" width="2" height="2" opacity="0.6"/>
  </g>

  <!-- chaotic three-body orbits -->
  <g fill="none" stroke="#9c92ba" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="3 4">
    <ellipse cx="66" cy="80" rx="46" ry="20" transform="rotate(-18 66 80)"/>
    <ellipse cx="66" cy="80" rx="28" ry="42" transform="rotate(26 66 80)"/>
  </g>

  <!-- the three suns -->
  <circle cx="40" cy="58" r="21" fill="url(#gPink)"/>
  <circle cx="40" cy="58" r="6.5" fill="#ff4d8d"/>
  <circle cx="92" cy="70" r="23" fill="url(#gCyan)"/>
  <circle cx="92" cy="70" r="7" fill="#39e6d6"/>
  <circle cx="64" cy="104" r="18" fill="url(#gPurple)"/>
  <circle cx="64" cy="104" r="6" fill="#b06bff"/>

  <!-- title plate -->
  <rect x="0" y="150" width="132" height="42" fill="#08060f" opacity="0.55"/>
  <text x="66" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-weight="700" font-size="22" letter-spacing="5" fill="#f4f0ff">三体</text>

  <!-- pixel frame -->
  <rect x="1" y="1" width="130" height="190" fill="none" stroke="#39e6d6" stroke-opacity="0.5" stroke-width="2" shape-rendering="crispEdges"/>
</svg>
